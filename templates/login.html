<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAFinity - Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
        .box { width: 100%; max-width: 380px; padding: 32px; background: rgba(255,255,255,0.04);
               border: 1px solid rgba(0,255,234,0.2); border-radius: 18px; }
        h1 { margin: 0 0 4px; font-size: 1.6rem; background: linear-gradient(90deg, #fff, #00FFD1);
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.sub { margin: 0 0 22px; color: rgba(255,255,255,0.55); font-size: 0.9rem; }
        label { display: block; margin: 14px 0 6px; font-size: 0.85rem; color: rgba(255,255,255,0.7); }
        input[type=text], input[type=password] { width: 100%; padding: 11px 12px; border-radius: 8px; font-size: 1rem;
               background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
        input:focus { outline: none; border-color: #00FFD1; }
        button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px; cursor: pointer;
                 font-size: 1rem; font-weight: 600; color: #000; background: #00FFD1; }
        .err { margin-bottom: 8px; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem;
               background: rgba(255,77,109,0.15); color: #ff8fa3; border: 1px solid rgba(255,77,109,0.35); }
        .setup { padding: 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5;
                 background: rgba(255,183,3,0.1); border: 1px solid rgba(255,183,3,0.35); color: #ffd166; }
        code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
        a.back { display: block; margin-top: 18px; text-align: center; color: rgba(255,255,255,0.5);
                 font-size: 0.85rem; text-decoration: none; }
    </style>
</head>
<body>
<div class="box">
    <h1>WAFinity Admin</h1>
    <p class="sub">Sign in to view the security dashboard</p>
    {% if not configured %}
        <div class="setup">No admin account exists yet.<br>In a terminal, in the project folder, run:<br>
            <code>python set_admin_password.py</code><br>then reload this page.</div>
    {% else %}
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('auth.login') }}" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ next }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Sign in</button>
        </form>
    {% endif %}
    <a class="back" href="{{ url_for('main.index') }}">Back to WAFinity</a>
</div>
</body>
</html>
